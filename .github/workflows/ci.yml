name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# GitHub-hosted runners only ship Ubuntu; the jobs below run inside a
# debian:trixie container, so every step executes on Debian trixie.
#
# Two jobs:
#   userspace - fmt / clippy / tests with stable Rust. AYA_BUILD_SKIP=1 skips the
#               eBPF compile (needs nightly + bpf-linker), so this job stays fast.
#   ebpf      - full build including the eBPF object: pinned nightly (whose LLVM
#               matches bpf-linker's LLVM 22), rust-src, and llvm-22 from apt.llvm.org.
#   release   - tag pushes only: publishes the ebpf job's binary as a GitHub release.

# ---------------------------------------------------------------------------
# Toolchain contract (kept together on purpose — these versions are coupled):
#   nightly-2026-06-15   rustc whose LLVM (22.1.x) matches bpf-linker's LLVM
#   LLVM 22              apt.llvm.org package installed in the ebpf job
#   bpf-linker 0.11.0    installed --locked with --features llvm-22
# Bumping ANY of the three requires re-verifying the other two (bitcode
# version mismatch fails the eBPF link with "Invalid record").
#
# SUPPLY-CHAIN (issue #1, resolved): every `uses:` below is pinned to an
# immutable commit SHA resolved from the official repository (tag kept in the
# comment; re-pin via dependabot). The apt.llvm.org installer is downloaded and
# sha256-verified against the pinned hash below BEFORE running. The
# VictoriaMetrics compose image is pinned by tag AND digest.
# ---------------------------------------------------------------------------

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  userspace:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 30
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates xz-utils build-essential pkg-config

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (thin rustup wrapper; the toolchain INPUT is what rolls)
        with:
          components: rustfmt, clippy

      # Must run after the toolchain is selected (keys include the rustc version).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: AYA_BUILD_SKIP=1 cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: AYA_BUILD_SKIP=1 cargo test

  ebpf:
    name: eBPF build
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 60
    steps:
      - name: Install system dependencies and LLVM 22
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates xz-utils wget gnupg lsb-release \
            build-essential pkg-config
          # apt.llvm.org hosts LLVM 22 for trixie; the pinned nightly's LLVM
          # (22.1.x) must not be newer than bpf-linker's LLVM or the bitcode
          # fails to link ("Invalid record").
          # Pinned installer (issue #1): download, verify the sha256 recorded below
          # (fetched from apt.llvm.org on 2026-08-28), then run. A hash mismatch
          # fails the job instead of executing a changed script. Re-pin by updating
          # the hash after inspecting the new script.
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          echo "03878e08f47b66cc95bc4b544b0db3c6d9ce8d60e6cf2492ae357984330a9eae  /tmp/llvm.sh" | sha256sum -c -
          bash /tmp/llvm.sh 22
          apt-get install -y --no-install-recommends \
            llvm-22-dev libclang-22-dev libpolly-22-dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pinned nightly: its LLVM version must stay compatible with bpf-linker.
      # @master + explicit toolchain input because the action only keeps
      # per-date branches for recent nightlies.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (thin rustup wrapper; the toolchain INPUT is what rolls)
        with:
          toolchain: nightly-2026-06-15
          components: rust-src, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Cache bpf-linker
        id: cache-bpf-linker
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /root/.cargo/bin/bpf-linker
          key: bpf-linker-0.11.0-llvm22-${{ runner.arch }}

      - name: Install bpf-linker
        if: steps.cache-bpf-linker.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install stable --profile minimal
          # Default features track the newest LLVM; pin llvm-22 to match apt's LLVM 22.
          LLVM_PREFIX=/usr/lib/llvm-22 cargo +stable install bpf-linker \
            --version 0.11.0 --locked --no-default-features --features llvm-22

      - name: Clippy eBPF crate (deny warnings)
        run: |
          cargo +nightly-2026-06-15 clippy -p vm-bandwidth-ebpf \
            --target bpfel-unknown-none -Z build-std=core -- -D warnings

      - name: Build release binary (including eBPF object)
        run: VM_BW_EBPF_TOOLCHAIN=nightly-2026-06-15 cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vm-bandwidth-monitor-linux-x86_64
          path: target/release/vm-bandwidth-monitor

  release:
    name: Publish release
    needs: ebpf
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vm-bandwidth-monitor-linux-x86_64
          path: dist

      # Include the tag in the file name so releases stay distinguishable.
      - name: Rename binary
        run: mv dist/vm-bandwidth-monitor "dist/vm-bandwidth-monitor-${GITHUB_REF_NAME}-linux-x86_64"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/vm-bandwidth-monitor-*
          generate_release_notes: true
