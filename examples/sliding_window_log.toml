# Sliding Window Log — EXACT sliding window, opt-in.
#
# Keeps a bounded per-flow log of recent packets and computes the exact
# sliding-window byte count; no boundary effects at all. The cost is real:
# every packet scans the flow's log, and each flow reserves one fixed-size
# map entry (16.4 KiB memlock each, see docs/kernel-validation.md §4).
#
# Gated behind an experimental switch on purpose; enable it AND size the
# map capacity for your expected flow count before using this algorithm.
# The log remembers the last 1024 admitted packets, so it can only enforce
# a window allowance (limit x limit_window / 8) below about 1024 packets'
# worth of bytes: ~1.5 MB of full-size frames, i.e. up to ~12Mbps with a 1s
# window. Above that it admits everything, which is why the limits below
# are small; validate against your workload first.

[network]
bridge = "br0"

[collector]
refresh_interval_ms = 1000
swl_map_max_entries = 32       # one entry per policed flow (16 IPs x 2 directions)

[experimental]
enable_sliding_window_log = true   # required, or the config is rejected

[[ip_ranges]]
name = "example-range"
range = "10.0.0.1-10.0.0.16"

  [ip_ranges.policy]
  algorithm      = "sliding_window_log"
  rx_threshold   = "50Mbps"
  tx_threshold   = "50Mbps"
  window         = "5m"
  trigger_ratio  = "80%"
  rx_limit       = "10Mbps"     # 1.25 MB per 1s window: within what the log can track
  tx_limit       = "10Mbps"
  limit_duration = "30m"
  limit_window   = "1s"        # window length (1s–60s)
