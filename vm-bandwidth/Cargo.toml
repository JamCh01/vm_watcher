[package]
name = "vm-bandwidth"
version.workspace = true
edition.workspace = true

[dependencies]
aya = "0.14"
vm-bandwidth-common = { path = "../vm-bandwidth-common", features = ["user"] }
vm-bandwidth-core = { path = "../vm-bandwidth-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
env_logger = "0.11"
futures = "0.3"
libc = "0.2"
log = "0.4"
notify = "8"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "1"

[build-dependencies]
aya-build = "0.2"
anyhow = "1"
cargo_metadata = "0.23"

[[bin]]
name = "vm-bandwidth-monitor"
path = "src/main.rs"
