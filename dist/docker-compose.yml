# VictoriaMetrics for vm-bandwidth-monitor's [metrics] export.
#
#   docker compose up -d
#
# Listens on 127.0.0.1:8428 only. The daemon pushes cumulative per-IP
# counters here (Prometheus import API); the --ui trend screen queries it.
services:
  victoriametrics:
    # Pinned (issue #1): official release tag v1.150.0 + digest resolved from
    # registry-1.docker.io on 2026-08-28. -storageDataPath needs v1.150+.
    image: victoriametrics/victoria-metrics:v1.150.0@sha256:54467c7764a3e6579199af1914bb779f01ce32265cd552eb5ae0d4f8a2b80a97
    container_name: victoriametrics
    restart: unless-stopped
    ports:
      - "127.0.0.1:8428:8428"
    volumes:
      - ./victoria-metrics-data:/victoria-metrics-data
    command:
      # v1.150+ renamed -storagePath to -storageDataPath.
      - -storageDataPath=/victoria-metrics-data
      # Keep 35 days so the UI's 30-day window always has data.
      - -retentionPeriod=35d
